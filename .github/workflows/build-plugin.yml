name: Build Plugin JAR

on:
  push:
    branches: ["main"]
    paths:
      - "xdverse-plugin/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build plugin JAR
        run: mvn clean package -q
        working-directory: xdverse-plugin

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: XDVerseLeaderboard
          path: xdverse-plugin/target/XDVerseLeaderboard.jar

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugin-latest
          name: "XDVerseLeaderboard Plugin (Latest)"
          body: |
            ## XD-VERSE Leaderboard Plugin

            ### Installation
            1. Download `XDVerseLeaderboard.jar`
            2. Upload it to your server's `plugins/` folder
            3. Restart your server
            4. Edit `plugins/XDVerseLeaderboard/config.yml`
            5. Set `github-token` to your GitHub Personal Access Token
            6. Run `/updateleaderboard` in-game to test!
          files: xdverse-plugin/target/XDVerseLeaderboard.jar
          make_latest: true
